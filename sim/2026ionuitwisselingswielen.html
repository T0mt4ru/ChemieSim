<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ionuitwisselingswielen</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0d0f14;
    --bg2:     #13161e;
    --bg3:     #1a1e28;
    --border:  rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text:    #e8eaf0;
    --muted:   #6b7280;
    --accent:  #7ee8a2;
    --accent2: #38bdf8;
    --amber:   #fbbf24;
    --coral:   #f87171;
    --font-head: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 2rem 2.5rem 1.5rem;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  h1 {
    font-family: var(--font-head);
    font-size: clamp(1.4rem, 3vw, 2.2rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #fff;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 0.3rem;
  }

  main {
    padding: 2rem 2.5rem 3rem;
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* WHEEL CARD */
  .wheel-section {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    width: 430px;
    flex-shrink: 0;
  }

  .wheel-title {
    font-family: var(--font-head);
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 1rem;
    padding-bottom: .65rem;
    border-bottom: 1px solid var(--border);
    letter-spacing: -0.01em;
  }

  .wheel-row {
    display: flex;
    gap: 1rem;
    align-items: flex-start;
  }

  .canvas-wrap {
    position: relative;
    flex-shrink: 0;
  }

  canvas {
    display: block;
    border-radius: 50%;
  }

  .pointer {
    position: absolute;
    top: 50%;
    right: -20px;
    transform: translateY(-50%);
    width: 0; height: 0;
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
    border-right: 25px solid var(--accent);
    filter: drop-shadow(0 0 6px rgba(126,232,162,0.5));
  }

  .right {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: .6rem;
    min-width: 0;
  }

  /* WINNER BOX */
  .winner-box {
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: .6rem .85rem;
    font-size: 13px;
    color: var(--muted);
    min-height: 46px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
  }

  .winner-text { flex: 1; line-height: 1.4; }
  .winner-text b { color: var(--accent); font-size: 15px; font-family: var(--font-head); }
  .winner-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }

  .remove-btn {
    padding: .28rem .6rem;
    font-size: 11px;
    border: 1px solid rgba(248,113,113,0.3);
    border-radius: 5px;
    background: transparent;
    color: var(--coral);
    cursor: pointer;
    white-space: nowrap;
    display: none;
    font-family: var(--font-mono);
    transition: background .15s, border-color .15s;
  }
  .remove-btn:hover { background: rgba(248,113,113,0.1); border-color: var(--coral); }

  /* SPIN BUTTON */
  .spin-btn {
    padding: .55rem 1rem;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border2);
    border-radius: 7px;
    background: var(--bg3);
    color: var(--accent);
    cursor: pointer;
    font-family: var(--font-mono);
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  .spin-btn:hover {
    background: rgba(126,232,162,0.08);
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(126,232,162,0.15);
  }
  .spin-btn:active { transform: scale(.97); }
  .spin-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }

  /* SEARCH */
  .search {
    padding: .45rem .7rem;
    font-size: 12px;
    border: 1px solid var(--border2);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    width: 100%;
    outline: none;
    font-family: var(--font-mono);
    transition: border-color .15s;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--muted); }

  .count {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    letter-spacing: 0.03em;
  }

  /* LIST */
  .list {
    max-height: 185px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
  }
  .list::-webkit-scrollbar { width: 3px; }
  .list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  .entry {
    padding: .32rem .75rem;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: .5rem;
    transition: background .1s;
  }
  .entry:last-child { border-bottom: none; }
  .entry:hover { background: var(--bg2); color: var(--text); }

  .entry-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .entry-text { flex: 1; }

  .entry-rm {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--border2);
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity .1s, color .1s;
  }
  .entry:hover .entry-rm { opacity: 1; }
  .entry-rm:hover { color: var(--coral); }

  footer {
    border-top: 1px solid var(--border);
    padding: 1.25rem 2.5rem;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    letter-spacing: 0.03em;
  }

  @media (max-width: 960px) {
    main { padding: 1.25rem 1rem 2rem; }
    header { padding: 1.25rem 1rem 1rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Ionuitwisselings<span>wielen</span></h1>
  <p class="subtitle">Draai een reagens · Secundair onderwijs chemie</p>
</header>

<main id="container"></main>

<footer>53 stoffen wiel 1 · 42 stoffen wiel 2 · verwijder een winnaar door op de knop te klikken</footer>

<script>
const WHEELS = [
  {
    title: "Wiel 1 — Reagens 1",
    winnerMessage: "",
    colors: ["#f7a53a","#54a3ed","#1764ac","#814609","#3a2a54","#89828c"],
    entries: ["(NH₄)₃PO₄","BaBr₂","HBr","K₂CO₃","H₂SO₄","AlI₃","(NH₄)₂CO₃","NaBr","Na₂SO₄","MgI₂","H₃PO₄","BaI₂","KOH","FeBr₂","(NH₄)₂S","NH₄I","FeCl₃","NH₄Cl","NaI","Na₂CO₃","HCl","MgCl₂","NaCl","Na₂S","AlBr₃","HI","K₃PO₄","NH₄Br","BaCl₂","NH₄NO₃","KCl","HNO₃","FeBr₃","K₃PO₄","CuBr₂","MgBr₂","KBr","NaOH","(NH₄)₂SO₄","CaBr₂","K₂S","ZnI₂","K₂SO₄","FeCl₂","ZnCl₂","Na₃PO₄","ZnBr₂","CuCl₂","CaI₂","AlCl₃","KI","NH₄OH","CaCl₂"]
  },
  {
    title: "Wiel 2 — Reagens 2",
    winnerMessage: "",
    colors: ["#ae3b37","#005682","#222629","#84888b","#c2c2c2","#dddddd"],
    entries: ["CaBr₂","Hg(NO₃)₂","Cu(NO₃)₂","BaI₂","Ca(NO₃)₂","FeBr₃","CaCl₂","Fe(NO₃)₃","BaBr₂","Na₂CO₃","CuBr₂","(NH₄)₂CO₃","NaOH","CuCl₂","AlBr₃","FeBr₂","FeCl₃","KOH","K₂CO₃","NH₄OH","K₂S","ZnI₂","MgBr₂","Mg(NO₃)₂","Na₂S","Al(NO₃)₃","Pb(NO₃)₂","AlCl₃","Fe(NO₃)₂","FeCl₂","Zn(NO₃)₂","AgNO₃","Ba(NO₃)₂","ZnI₂","ZnBr₂","CaI₂","MgI₂","BaCl₂","ZnCl₂","AlI₃","(NH₄)₂S","MgCl₂"]
  }
];

const state = WHEELS.map(w => ({ entries: [...w.entries], angle: 0, spinning: false }));

function isLight(hex) {
  if (!hex || hex.length < 7) return true;
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (r*299 + g*587 + b*114) / 1000 > 145;
}

function drawWheel(wi) {
  const w = WHEELS[wi];
  const s = state[wi];
  const canvas = document.getElementById('canvas-' + wi);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const cx = 130, cy = 130, r = 122;
  const entries = s.entries;
  const n = entries.length;
  if (n === 0) { ctx.clearRect(0,0,260,260); return; }
  const colors = w.colors;
  const arc = (2 * Math.PI) / n;
  ctx.clearRect(0, 0, 260, 260);
  for (let i = 0; i < n; i++) {
    const start = s.angle + i * arc;
    const end = start + arc;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, start, end); ctx.closePath();
    ctx.fillStyle = colors[i % colors.length]; ctx.fill();
    ctx.strokeStyle = 'rgba(13,15,20,0.5)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(start + arc / 2); ctx.textAlign = 'right';
    const fSize = Math.min(12, Math.max(7, 280 / n));
    ctx.font = `${fSize}px 'DM Mono', monospace`;
    ctx.fillStyle = isLight(colors[i % colors.length]) ? '#0d0f14' : '#e8eaf0';
    const txt = entries[i];
    ctx.fillText(txt.length > 13 ? txt.slice(0,12) + '…' : txt, r - 7, fSize * 0.36);
    ctx.restore();
  }
  // hub
  ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI*2);
  ctx.fillStyle = '#0d0f14'; ctx.fill();
  ctx.strokeStyle = 'rgba(126,232,162,0.4)'; ctx.lineWidth = 2; ctx.stroke();
}

function renderList(wi) {
  const w = WHEELS[wi];
  const s = state[wi];
  const q = (document.getElementById('search-' + wi) || { value: '' }).value.toLowerCase();
  const listEl = document.getElementById('list-' + wi);
  const countEl = document.getElementById('count-' + wi);
  if (!listEl) return;
  const filtered = s.entries.filter(e => e.toLowerCase().includes(q));
  countEl.textContent = `${s.entries.length} item${s.entries.length !== 1 ? 's' : ''}`;
  listEl.innerHTML = '';
  filtered.forEach(e => {
    const realIdx = s.entries.indexOf(e);
    const col = w.colors[realIdx % w.colors.length];
    const row = document.createElement('div'); row.className = 'entry';
    row.innerHTML = `<span class="entry-dot" style="background:${col}"></span><span class="entry-text">${e}</span><button class="entry-rm" title="Verwijder" onclick="removeEntry(${wi}, '${e.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">×</button>`;
    listEl.appendChild(row);
  });
}

function removeEntry(wi, text) {
  const s = state[wi];
  const idx = s.entries.indexOf(text);
  if (idx === -1) return;
  s.entries.splice(idx, 1);
  drawWheel(wi);
  renderList(wi);
  const wt = document.getElementById('winner-text-' + wi);
  const rb = document.getElementById('remove-btn-' + wi);
  if (wt && wt.dataset.winner === text) {
    wt.innerHTML = '<span style="color:var(--muted)">Verwijderd uit de lijst</span>';
    wt.dataset.winner = '';
    if (rb) rb.style.display = 'none';
  }
}

function spin(wi) {
  const s = state[wi];
  if (s.spinning || s.entries.length === 0) return;
  s.spinning = true;
  const btn = document.getElementById('spin-' + wi);
  if (btn) btn.disabled = true;
  const wt = document.getElementById('winner-text-' + wi);
  const rb = document.getElementById('remove-btn-' + wi);
  wt.innerHTML = '<span style="color:var(--muted)">Aan het draaien</span>';
  wt.dataset.winner = '';
  if (rb) rb.style.display = 'none';

  const n = s.entries.length;
  const extra = (Math.PI * 2) * 10 + Math.random() * Math.PI * 2;
  const duration = 3000 + Math.random() * 2000;
  const startTime = performance.now();
  const startAngle = s.angle;

  function frame(now) {
    const prog = Math.min((now - startTime) / duration, 1);
    const ease = 1 - Math.pow(1 - prog, 4);
    s.angle = startAngle + extra * ease;
    drawWheel(wi);
    if (prog < 1) {
      requestAnimationFrame(frame);
    } else {
      s.angle = s.angle % (Math.PI * 2);
      s.spinning = false;
      if (btn) btn.disabled = false;
      const arc = (Math.PI * 2) / n;
      const ptr = (Math.PI - s.angle + Math.PI * 2) % (Math.PI * 2);
      const idx = Math.floor(ptr / arc) % n;
      const winner = s.entries[idx];
      const w = WHEELS[wi];
      const msg = w.winnerMessage ? `<span class="winner-label">${w.winnerMessage} —</span> ` : '';
      wt.innerHTML = `${msg}<b>${winner}</b>`;
      wt.dataset.winner = winner;
      if (rb) {
        rb.style.display = 'inline-block';
        rb.onclick = () => removeEntry(wi, winner);
      }
      drawWheel(wi);
    }
  }
  requestAnimationFrame(frame);
}

function buildUI() {
  const container = document.getElementById('container');
  WHEELS.forEach((w, wi) => {
    const sec = document.createElement('div'); sec.className = 'wheel-section';
    sec.innerHTML = `
      <div class="wheel-title">${w.title}</div>
      <div class="wheel-row">
        <div class="canvas-wrap">
          <canvas id="canvas-${wi}" width="260" height="260"></canvas>
          <div class="pointer"></div>
        </div>
        <div class="right">
          <div class="winner-box">
            <span class="winner-text" id="winner-text-${wi}" data-winner="">Druk op draaien om te beginnen</span>
            <button class="remove-btn" id="remove-btn-${wi}">Verwijder</button>
          </div>
          <button class="spin-btn" id="spin-${wi}" onclick="spin(${wi})">▶ Draaien</button>
          <input class="search" id="search-${wi}" placeholder="Zoek in de lijst…" type="text" oninput="renderList(${wi})">
          <div class="count" id="count-${wi}"></div>
          <div class="list" id="list-${wi}"></div>
        </div>
      </div>`;
    container.appendChild(sec);
    drawWheel(wi);
    renderList(wi);
  });
}

buildUI();
</script>
</body>
</html>
